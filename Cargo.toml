[package]
name = "escrow-vault"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "21.7.4"

[dev-dependencies]
soroban-sdk = { version = "21.7.4", features = ["testutils"] }
# Pinned to avoid a resolver conflict where soroban-env-host's testutils
# pulls in ed25519-dalek 3.0.0 alongside another dependent's 2.2.0, and the
# two versions' incompatible rand_core majors break the SigningKey::generate
# trait bound (see: https://github.com/dalek-cryptography/ed25519-dalek/issues/162).
ed25519-dalek = "=2.2.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
